name: CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify bundled browser dist
        run: npm run check:kwahlg-calc-dist

      - name: Run test suite
        run: npm test
